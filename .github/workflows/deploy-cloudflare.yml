name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      exam:
        description: Exam to build and deploy (one Worker per exam)
        type: choice
        options:
          - gh-600
          - gh-500
        default: gh-600
        required: true

permissions:
  contents: read

concurrency:
  group: cloudflare-production-${{ inputs.exam }}
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXAM: ${{ inputs.exam }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate and build
        run: npm run build
      - name: Resolve Worker name and domain
        id: worker
        run: |
          echo "name=$(node -p "require('./exams/' + process.env.EXAM + '/data/site.json').workerName")" >> "$GITHUB_OUTPUT"
          echo "domain=$(node -p "require('./exams/' + process.env.EXAM + '/data/site.json').domain")" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name ${{ steps.worker.outputs.name }} --domain ${{ steps.worker.outputs.domain }}
